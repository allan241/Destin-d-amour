<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESTIN D'AMOUR - Films & Séries en Français</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:white}
header{background:#000;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:20px} header b span{color:#ff7a00}
h2{margin:18px 10px 10px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 10px}
.card{background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:240px;object-fit:cover;display:block;background:#222}
.card .info{padding:8px;text-align:center}
.card .info b{font-size:14px;display:block}
.card .info small{color:#bbb;font-size:12px}
.badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.8);font-size:11px;padding:4px 6px;border-radius:5px}
.note{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.8);font-size:12px;padding:4px 6px;border-radius:5px}
.wrap{position:relative}
#detail{display:none;padding:12px}
#detail img{width:100%;border-radius:10px;height:260px;object-fit:cover}
#detail h1{margin:12px 0 6px;font-size:22px}
#detail p{color:#ccc;line-height:1.5;font-size:14px}
.meta{color:#ff7a00;margin:10px 0;font-weight:bold;font-size:14px}
.btns{display:flex;gap:10px;margin:14px 0}
.btns button{flex:1;padding:12px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.vf{background:#ff7a00;color:white} .vost{background:#333;color:white}
.ep{background:#1c1c1c;padding:12px;border-radius:8px;margin-top:8px}
.back{color:#ff7a00;cursor:pointer;margin-bottom:10px;display:block}
footer{text-align:center;color:#777;padding:20px;font-size:12px}
</style>
</head>
<body>

<header><b>DESTIN <span>▶</span> D'AMOUR</b><div>🔔 <span style="background:red;border-radius:50%;padding:2px 6px;font-size:12px">3</span> ☰</div></header>

<div id="home">
<h2>🎬 Nouveautés Films</h2>
<div class="grid" id="films"></div>
<h2>📺 Nouveautés Séries</h2>
<div class="grid" id="series"></div>
</div>

<div id="detail">
<span class="back" onclick="showHome()">‹ Retour</span>
<img id="d-img">
<h1 id="d-title"></h1>
<p id="d-desc"></p>
<div class="meta" id="d-meta"></div>
<div style="background:#000;padding:10px;border-radius:10px;text-align:center">▶ Bande-annonce officielle en Français<br><small style="color:#aaa">Clique sur VF pour voir en Français</small></div>
<div class="btns"><button class="vf" onclick="alert('Version Française - Bientôt disponible')">☁️ VF</button><button class="vost" onclick="alert('Version Sous-Titrée Français')">☁️ VOSTFR</button></div>
<div id="d-eps"></div>
</div>

<footer>DESTIN D'AMOUR © 2026 - Catalogue Films & Séries - Tout en Français</footer>

<script>
const films=[
{t:"Avengers : Endgame",img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",duree:"3h01",annee:"2019",note:"8.1",genre:"Action, Aventure",desc:"Les Avengers survivants se réunissent pour réparer les dégâts de Thanos et restaurer l'ordre dans l'univers. Le combat final pour sauver le monde."},
{t:"Avengers : Infinity War",img:"https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg",duree:"2h29",annee:"2018",note:"8.3",genre:"Action, Aventure",desc:"Thanos veut réunir les 6 Pierres d'Infinité pour détruire la moitié de l'univers. Les Avengers doivent l'arrêter à tout prix."},
{t:"Fast & Furious X",img:"https://image.tmdb.org/t/p/w500/fiVW06jE7z9YnO4trhaMEdghSiPt.jpg",duree:"2h21",annee:"2023",note:"7.2",genre:"Action",desc:"Dom Toretto et sa famille doivent affronter Dante, un nouvel ennemi dangereux qui veut se venger. Courses, action et famille."},
{t:"Le Roi Lion",img:"https://image.tmdb.org/t/p/w500/dzBtMocZuJbjLOXvrl4zGYlKToE.jpg",duree:"1h58",annee:"2019",note:"7.1",genre:"Aventure, Famille",desc:"Simba, jeune lion, doit retrouver sa place comme roi après la mort de son père Mufasa. Une histoire d'amour, de courage et de destin."}
];
const series=[
{t:"Mercredi",img:"https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg",duree:"8 Épisodes • 45 min",annee:"2022",note:"8.8",genre:"Comédie, Fantastique",desc:"Mercredi Addams enquête sur des mystères à l'académie Nevermore. Drôle, sombre et pleine de suspense.",eps:8},
{t:"Amour Interdit",img:"https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg",duree:"10 Épisodes • 50 min",annee:"2024",note:"7.9",genre:"Drame, Romance",desc:"Deux jeunes d'une même famille tombent amoureux malgré les interdits. Une histoire d'amour impossible à Libreville.",eps:10},
{t:"Heartland",img:"https://image.tmdb.org/t/p/w500/uc3c5m7T0jXxXW7Jz20NpMygczOkv.jpg",duree:"16 Saisons",annee:"2007",note:"8.0",genre:"Drame, Famille",desc:"La famille Fleming vit dans un ranch. Amy soigne les chevaux et aide sa famille à surmonter les épreuves.",eps:10},
{t:"Destin D'Amour",img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",duree:"12 Épisodes • 1h24",annee:"2026",note:"8.5",genre:"Drame, Romance",desc:"Une histoire d'amour à Libreville. Deux destins qui se croisent. Chaque épisode dure 1h24, comme tu voulais.",eps:12}
];

function card(f,type){
return `<div class="card" onclick='openDetail(${JSON.stringify(f).replace(/'/g,"")}, "${type}")'>
<div class="wrap"><img src="${f.img}"><div class="badge">VF+VOSTFR HD</div><div class="note">⭐ ${f.note}</div></div>
<div class="info"><b>${f.t}</b><small>${f.duree} • ${f.annee}</small></div></div>`
}
document.getElementById('films').innerHTML=films.map(f=>card(f,'film')).join('');
document.getElementById('series').innerHTML=series.map(f=>card(f,'serie')).join('');

function openDetail(f,type){
document.getElementById('home').style.display='none';
document.getElementById('detail').style.display='block';
document.getElementById('d-img').src=f.img;
document.getElementById('d-title').innerText=f.t;
document.getElementById('d-desc').innerText=f.desc;
document.getElementById('d-meta').innerText=(type=='film'?'Film':'Série')+' • '+f.annee+' • Durée : '+f.duree+' • Note : '+f.note+'/10 • '+f.genre;
let eps='';
if(type=='film'){eps=`<div class="ep">▶ Film complet - ${f.duree} - En Français</div>`}
else{for(let i=1;i<=Math.min(f.eps,5);i++){eps+=`<div class="ep">▶ Épisode ${i} - 45 min - VF</div>`}}
document.getElementById('d-eps').innerHTML=eps;
window.scrollTo(0,0);
}
function showHome(){document.getElementById('home').style.display='block';document.getElementById('detail').style.display='none';}
</script>
</body>
</html>
